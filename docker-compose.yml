services:
  backend_ai:
    container_name: backend_ai
    build:
      context: backend_ai
      dockerfile: Dockerfile
    ports:
      - '8001:8000'
    env_file: backend_ai/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend_ai:/app/

  db:
    container_name: postgres_db
    image: postgres:15.0
    ports:
      - '5432:5432'
    volumes:
      - ./databases/postgres_data:/var/lib/postgresql/data
    env_file: backend_ai/.env
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    container_name: redis
    image: redis:8-alpine
    restart: always

  celery:
    container_name: celery
    build:
      context: backend_ai
    command: celery --app=backend_ai worker -l INFO
    env_file: backend_ai/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend_ai:/app/

  flower:
    container_name: flower
    build:
      context: backend_ai
    command: celery --app=backend_ai.celery_app flower
    ports:
      - "5555:5555"
    volumes:
      - ./backend_ai:/app/
    working_dir: /app
    env_file: backend_ai/.env
    depends_on:
      - celery