services:
  backend_ai:
    container_name: backend_ai
    build:
      context: backend_ai
      dockerfile: Dockerfile
    ports:
      - '8000:8000'
    env_file: backend_ai/.env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend_ai:/app
  db:
    container_name: postgres_db
    image: postgres:15.0
    ports:
      - '5432:5432'
    volumes:
      - ./databases/postgres_data:/var/lib/postgresql/data
    env_file: backend_ai/.env
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgresdb
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
